<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostGIS Raster Viewer (dbx-plugin) — 本地预览</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
      #frame { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <!--
      Standalone harness：伪造 window.parent.__dbxBridge（ui/lib/host.mjs 的回退路径），
      在无 DBX 的环境下驱动 result-view 工作台全链路（解码 / 影像 / 像元值表 / 统计）。

      Query string:
        ?size=tiny|small|large|user    栅格尺寸（user = 201×301，真实卡顿场景）
        ?bands=1|3                     波段数
        &rows=N                        合成多少行栅格
    -->
    <iframe id="frame"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const size = params.get("size") || "user";
      const bands = Number(params.get("bands") || 1);
      const rowCount = Number(params.get("rows") || 2);

      const WGS84 = 4326;
      const DIMENSIONS = { tiny: [8, 6], small: [96, 72], large: [640, 480], user: [201, 301] };
      const [WIDTH, HEIGHT] = DIMENSIONS[size] ?? DIMENSIONS.user;

      /**
       * Raster WKB (hex)。布局与本插件 ui/lib/wkb-raster.mjs 解析器一致：
       *   endian(1) version(2,uint16) nBands(2,uint16) 6×f64
       *   (scaleX, scaleY, ipX, ipY, skewX, skewY) srid(4) width(2) height(2)
       *   共 61 字节；随后每波段：pixelType|标志(1) + nodata(按像元类型宽度) + 像元值。
       * 注意与 postgis-viewer 的合成器不同（那边多一个 ipZ、nodata 固定 f64）。
       */
      function buildRasterHex(width, height, bandCount = 1, pixelTypeId = 10, seed = 0) {
        const bytesPerSample = pixelTypeId === 10 ? 4 : pixelTypeId === 11 ? 8 : pixelTypeId === 5 ? 1 : 2;
        const headerSize = 61;
        const bandHeader = 1 + bytesPerSample; // ptByte + nodata（同像元类型宽度）
        const total = headerSize + bandCount * (bandHeader + width * height * bytesPerSample);
        const buffer = new ArrayBuffer(total);
        const view = new DataView(buffer);
        let offset = 0;
        view.setUint8(offset, 1); offset += 1;              // little endian
        view.setUint16(offset, 0, true); offset += 2;       // version 0
        view.setUint16(offset, bandCount, true); offset += 2;
        view.setFloat64(offset, 0.0025, true); offset += 8;     // scaleX
        view.setFloat64(offset, -0.0025, true); offset += 8;    // scaleY (north-up)
        view.setFloat64(offset, 116.3 + seed * 0.05, true); offset += 8;  // ipX
        view.setFloat64(offset, 39.95 - seed * 0.03, true); offset += 8;  // ipY
        view.setFloat64(offset, 0, true); offset += 8;      // skewX
        view.setFloat64(offset, 0, true); offset += 8;      // skewY
        view.setUint32(offset, WGS84, true); offset += 4;
        view.setUint16(offset, width, true); offset += 2;
        view.setUint16(offset, height, true); offset += 2;

        for (let b = 0; b < bandCount; b += 1) {
          view.setUint8(offset, pixelTypeId | 0x20); offset += 1; // hasNodata 标志
          if (pixelTypeId === 10) view.setFloat32(offset, -9999, true);
          else if (pixelTypeId === 11) view.setFloat64(offset, -9999, true);
          else if (pixelTypeId === 5) view.setUint8(offset, 255);
          else view.setInt16(offset, -1, true);
          offset += bytesPerSample;
          for (let y = 0; y < height; y += 1) {
            for (let x = 0; x < width; x += 1) {
              const nx = x / width;
              const ny = y / height;
              let value = 1000 * Math.exp(-(((nx - 0.5) ** 2) / 0.03 + ((ny - 0.5) ** 2) / 0.05));
              value += 120 * Math.sin(nx * 14 + seed) * Math.cos(ny * 11);
              value += b * 60 + seed * 25;
              if (nx > 0.72 && nx < 0.82 && ny > 0.2 && ny < 0.34) value = -9999;
              if (pixelTypeId === 10) view.setFloat32(offset, value, true);
              else if (pixelTypeId === 11) view.setFloat64(offset, value, true);
              else if (pixelTypeId === 5) view.setUint8(offset, Math.max(0, Math.min(255, Math.round(value / 8))), true);
              else view.setInt16(offset, Math.round(value), true);
              offset += bytesPerSample;
            }
          }
        }
        const bytes = new Uint8Array(buffer);
        let hex = "";
        for (let i = 0; i < bytes.length; i += 1) hex += bytes[i].toString(16).padStart(2, "0");
        return hex;
      }

      const rasterResult = {
        columns: ["id", "scene", "rast", "acquired_at"],
        rows: Array.from({ length: rowCount }, (_, i) => [
          i + 1,
          `scene_${i + 1}`,
          buildRasterHex(WIDTH, HEIGHT, i === 1 ? 3 : bands, 10, i),
          `2026-0${(i % 9) + 1}-14`,
        ]),
        truncated: false,
      };

      const initPayload = {
        contributionId: "com.clog.ouranos.postgis-raster.view",
        capabilities: { dataApi: true, storage: true, workbenchTitle: true },
        context: {
          connectionId: "local-preview",
          database: "gis",
          schema: "public",
          sql: "SELECT id, scene, rast, acquired_at FROM scenes",
          result: rasterResult,
        },
      };

      const store = new Map();

      const Bridge = {
        contributionId: initPayload.contributionId,
        locale: "zh-CN",
        theme: { appearance: "light", tokens: {} },
        capabilities: initPayload.capabilities,
        ready: Promise.resolve(initPayload),
        context: initPayload.context,
        onContext(handler) { void handler; return () => {}; },
        onEnv(handler) { void handler; return () => {}; },
        async request(method) {
          if (method === "host.getContext") return initPayload.context;
          if (method === "host.queryData") {
            return { columns: [{ name: "x", dataType: "text" }], rows: [["ok"]], truncated: false, elapsedMs: 3 };
          }
          throw new Error(`unsupported method ${method}`);
        },
        storage: {
          async get(key) { return store.has(key) ? store.get(key) : null; },
          async set(key, value) { store.set(key, value); },
          async delete(key) { store.delete(key); },
        },
        setTitle() {},
        copy(text) { navigator.clipboard?.writeText(text); return true; },
      };

      window.__dbxBridge = Bridge;
      document.getElementById("frame").src = new URL("../ui/index.html", location.href).href;
    </script>
  </body>
</html>
